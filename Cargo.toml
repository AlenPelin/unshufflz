[package]
name = "unshufflz"
version = "0.2.0"
edition = "2021"
build = "build.rs"

# The installer embeds target/release/unshufflz.exe, so it is built separately:
#   cargo build --release            (app only, default member)
#   cargo build --release -p unshufflz-setup
[workspace]
members = [".", "installer"]
default-members = ["."]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
