[package]
name = "unshufflz-setup"
version = "0.3.2"
edition = "2021"
build = "build.rs"

[dependencies]
# COM (IShellLinkW / IPersistFile) for the Start menu shortcut
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
